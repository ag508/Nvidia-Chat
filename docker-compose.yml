services:
  nvidia-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nvidia-chat-app
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
