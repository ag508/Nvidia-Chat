services:
  nvidia-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: nvidia-chat:latest
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
